<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Facilities — CampusBook Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-brand"><span class="mark">CB</span><span class="title">CampusBook</span></div>
    <nav class="admin-nav">
      <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</a>
      <a href="facilities.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>Facilities</a>
      <a href="bookings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Bookings</a>
      <a href="users.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Users</a>
      <a href="requests.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Pending Requests</a>
      <a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15l4-6 3 3 5-7"/></svg>Reports</a>
    </nav>
    <div class="admin-sidebar-foot">
      <a href="#" class="admin-logout-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Logout</a>
    </div>
  </aside>
  <div class="admin-sidebar-scrim" id="adminSidebarScrim"></div>

  <div class="admin-main">
    <div class="admin-topbar">
      <button class="admin-sidebar-toggle" id="adminSidebarToggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="admin-brand" style="margin:0;"><span class="mark">CB</span><span class="title" style="font-size:1rem;">CampusBook</span></div>
      <div class="admin-avatar">A</div>
    </div>

    <div class="admin-content">
      <div class="admin-header-row">
        <div><h1>Facility Management</h1><p class="welcome">Add, edit, and manage bookable spaces.</p></div>
        <button class="adm-btn primary" id="addFacilityBtn">+ Add Facility</button>
      </div>

      <div class="admin-panel">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>Facility</th><th>Category</th><th>Location</th><th>Capacity</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="facilitiesTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="adm-modal-backdrop" id="facilityModal">
  <div class="adm-modal">
    <div class="adm-modal-head"><h3 id="facilityModalTitle">Add Facility</h3><button class="adm-modal-close" data-close-adm-modal><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <form id="facilityForm">
      <div class="adm-modal-body">
        <div class="admin-field"><label for="fName">Facility Name</label><input id="fName" required></div>
        <div class="adm-field-row">
          <div class="admin-field"><label for="fCategory">Category</label>
            <select id="fCategory">
              <option>Academic</option><option>Sports</option><option>Student Spaces</option>
            </select>
          </div>
          <div class="admin-field"><label for="fCapacity">Capacity</label><input id="fCapacity" type="number" min="1" required></div>
        </div>
        <div class="admin-field"><label for="fLocation">Location</label><input id="fLocation" required></div>
        <div class="admin-field"><label for="fDescription">Description</label><input id="fDescription" placeholder="Short description"></div>
        <div class="adm-field-row">
          <div class="admin-field"><label for="fOpen">Opening Time</label><input id="fOpen" type="time" required></div>
          <div class="admin-field"><label for="fClose">Closing Time</label><input id="fClose" type="time" required></div>
        </div>
        <div class="admin-field"><label for="fStatus">Status</label>
          <select id="fStatus"><option>Active</option><option>Inactive</option></select>
        </div>
      </div>
      <div class="adm-modal-foot">
        <button type="button" class="adm-btn" data-close-adm-modal>Cancel</button>
        <button type="submit" class="adm-btn primary">Save Facility</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
