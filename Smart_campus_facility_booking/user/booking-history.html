<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking History — CampusBook</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/user.css">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar">
    <div class="brand"><span class="mark">CB</span>CampusBook</div>
    <nav class="side-nav">
      <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</a>
      <a href="../facilities.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Browse Facilities</a>
      <a href="my-bookings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>My Bookings</a>
      <a href="booking-history.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 3"/></svg>Booking History</a>
      <a href="notifications.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Notifications</a>
      <a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>Profile</a>
    </nav>
    <div class="sidebar-foot">
      <a href="#" class="logout-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Logout</a>
    </div>
  </aside>
  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <div class="app-main">
    <div class="app-topbar">
      <button class="sidebar-toggle" id="sidebarToggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="brand"><span class="mark">CB</span>CampusBook</div>
      <div class="avatar-circle">AV</div>
    </div>

    <div class="app-content">
      <div class="app-header-row"><h1>Booking History</h1></div>

      <div class="filter-pills">
        <button class="active" data-filter="All">All</button>
        <button data-filter="Approved">Approved</button>
        <button data-filter="Rejected">Rejected</button>
        <button data-filter="Cancelled">Cancelled</button>
      </div>

      <div class="panel">
        <div class="table-wrap" id="historyTableWrap">
          <table class="data-table">
            <thead><tr><th>Booking ID</th><th>Facility</th><th>Date</th><th>Time</th><th>Status</th></tr></thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
        <div class="empty-state" id="historyEmpty" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 3"/></svg>
          <h3>Nothing here yet</h3>
          <p>Try a different filter.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/user.js"></script>
</body>
</html>
