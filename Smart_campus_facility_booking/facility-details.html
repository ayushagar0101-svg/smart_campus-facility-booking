<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facility Details — CampusBook</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="mark">CB</span>CampusBook</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="facilities.html" class="active">Facilities</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
      <a href="login.html">Login</a>
    </nav>
    <div class="header-actions">
      <a href="login.html" class="btn btn-ghost">Login</a>
      <a href="register.html" class="btn btn-primary">Register</a>
      <button class="nav-toggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="wrap" id="detailsRoot">
  <p style="margin:24px 0 0; font-size:0.88rem; color:var(--ink-soft);">
    <a href="facilities.html" style="color:var(--forest); font-weight:600;">&larr; Back to Facilities</a>
  </p>

  <div class="details-hero">
    <div>
      <div class="details-media" id="facMedia"></div>
      <h1 id="facName" style="margin-top:26px;"></h1>
      <span class="badge" id="facAvailBadge" style="margin-top:8px;"></span>
      <p class="desc" id="facDesc" style="margin-top:16px;"></p>
      <div class="facility-meta">
        <span>🏷️ Category: <strong id="facCategory"></strong></span>
        <span>📍 Location: <strong id="facLocation"></strong></span>
        <span>👥 Capacity: <strong id="facCapacity"></strong></span>
      </div>
      <h4 style="margin-top:26px; font-size:1rem;">Available equipment</h4>
      <div class="equip-list" id="facEquipment" style="margin-top:12px;"></div>
      <h4 style="font-size:1rem;">Opening hours</h4>
      <div class="hours-row"><span>Open</span><strong id="facHoursOpen"></strong></div>
      <div class="hours-row"><span>Close</span><strong id="facHoursClose"></strong></div>
    </div>

    <div class="booking-panel" id="book">
      <h3 style="margin-bottom:18px;">Book This Facility</h3>
      <form id="bookingForm">
        <input type="hidden" id="bookingFacilityId">
        <div class="field">
          <label for="bookDate">Date</label>
          <input type="date" id="bookDate" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="bookStart">Start time</label>
            <input type="time" id="bookStart" required>
          </div>
          <div class="field">
            <label for="bookEnd">End time</label>
            <input type="time" id="bookEnd" required>
          </div>
        </div>
        <div class="field">
          <label for="bookPurpose">Purpose</label>
          <input type="text" id="bookPurpose" placeholder="e.g. Department seminar" required>
        </div>
        <div class="field">
          <label for="bookParticipants">Number of participants</label>
          <input type="number" id="bookParticipants" min="1" placeholder="e.g. 20" required>
        </div>
        <button type="button" class="btn btn-outline btn-block" id="checkAvailabilityBtn">Check Availability</button>
        <div style="margin-top:14px;">
          <span class="badge" id="availabilityResult" style="display:none;"></span>
        </div>
        <button type="button" class="btn btn-primary btn-block" id="confirmBookingBtn" style="display:none; margin-top:14px;">Confirm Booking</button>
      </form>
      <div id="bookingConfirmed" style="display:none;"></div>
    </div>
  </div>
</div>

<footer class="site-footer" style="margin-top:40px;">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none; padding-top:0;">
      <span>&copy; 2026 CampusBook &mdash; University Facility Management System</span>
      <a href="index.html" style="color:rgba(255,255,255,0.75);">Back to home</a>
    </div>
  </div>
</footer>

<script src="js/main.js"></script>

<script>

let currentFacility = null;


// Get facility ID from URL
const params = new URLSearchParams(window.location.search);
const facilityId = params.get("id");


// HTML elements
const facName = document.getElementById("facName");
const facDesc = document.getElementById("facDesc");
const facCategory = document.getElementById("facCategory");
const facLocation = document.getElementById("facLocation");
const facCapacity = document.getElementById("facCapacity");
const facHoursOpen = document.getElementById("facHoursOpen");
const facHoursClose = document.getElementById("facHoursClose");
const facAvailBadge = document.getElementById("facAvailBadge");

const bookingFacilityId = document.getElementById("bookingFacilityId");

const bookDate = document.getElementById("bookDate");
const bookStart = document.getElementById("bookStart");
const bookEnd = document.getElementById("bookEnd");
const bookPurpose = document.getElementById("bookPurpose");
const bookParticipants = document.getElementById("bookParticipants");

const checkAvailabilityBtn =
    document.getElementById("checkAvailabilityBtn");

const confirmBookingBtn =
    document.getElementById("confirmBookingBtn");

const availabilityResult =
    document.getElementById("availabilityResult");

const bookingConfirmed =
    document.getElementById("bookingConfirmed");


// Check facility ID
if (!facilityId) {

    alert("No facility selected.");

} else {

    loadFacility();
}


// Load facility from MySQL
async function loadFacility() {

    try {

        const response =
            await fetch(`http://localhost:3000/facility/${facilityId}`);

        const facility = await response.json();

        if (!response.ok) {
            throw new Error(facility.message);
        }

        currentFacility = facility;

        // Display facility information
        facName.textContent = facility.name;

        facDesc.textContent =
            facility.description || "No description available.";

        facCategory.textContent =
            facility.category || "General";

        facLocation.textContent =
            facility.location || "N/A";

        facCapacity.textContent =
            facility.capacity || "N/A";

        facHoursOpen.textContent =
            facility.open_time || "--";

        facHoursClose.textContent =
            facility.close_time || "--";

        facAvailBadge.textContent =
            facility.availability;

        bookingFacilityId.value =
            facility.facility_id;

        // Set maximum participants
        if (facility.capacity) {
            bookParticipants.max = facility.capacity;
        }

    } catch (error) {

        console.log(error);

        alert("Unable to load facility.");
    }
}


// Check availability
checkAvailabilityBtn.addEventListener("click", async function() {

    const date = bookDate.value;
    const startTime = bookStart.value;
    const endTime = bookEnd.value;

    if (!date || !startTime || !endTime) {

        alert("Please select date, start time and end time.");

        return;
    }


    if (startTime >= endTime) {

        alert("End time must be after start time.");

        return;
    }


    try {

        const response = await fetch(
            "http://localhost:3000/check-availability",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    facility_id: facilityId,
                    date: date,
                    start_time: startTime,
                    end_time: endTime
                })
            }
        );


        const data = await response.json();


        availabilityResult.style.display = "inline-block";

        if (data.available) {

            availabilityResult.textContent =
                "Available ✓";

            confirmBookingBtn.style.display = "block";

        } else {

            availabilityResult.textContent =
                data.message;

            confirmBookingBtn.style.display = "none";
        }


    } catch (error) {

        console.log(error);

        alert("Cannot connect to server.");
    }

});


// Confirm booking
confirmBookingBtn.addEventListener("click", async function() {

    // Get logged-in user
    const storedUser = localStorage.getItem("user");

    if (!storedUser) {

        alert("Please login before booking.");

        window.location.href = "login.html";

        return;
    }


    const user = JSON.parse(storedUser);


    const date = bookDate.value;
    const startTime = bookStart.value;
    const endTime = bookEnd.value;
    const purpose = bookPurpose.value.trim();
    const participants =
        Number(bookParticipants.value);


    if (!date || !startTime || !endTime || !purpose || !participants) {

        alert("Please fill all booking details.");

        return;
    }


    if (
        currentFacility.capacity &&
        participants > currentFacility.capacity
    ) {

        alert(
            `Maximum capacity is ${currentFacility.capacity} participants.`
        );

        return;
    }


    try {

        const response = await fetch(
            "http://localhost:3000/booking",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    user_id: user.user_id,

                    facility_id: facilityId,

                    date: date,

                    start_time: startTime,

                    end_time: endTime,

                    purpose: purpose,

                    participants: participants
                })
            }
        );


        const data = await response.json();


        if (response.ok) {

            bookingConfirmed.style.display = "block";

            bookingConfirmed.innerHTML = `
                <div style="margin-top:20px;">
                    <h4>Booking Request Submitted ✓</h4>
                    <p>
                        Your booking request has been submitted
                        successfully.
                    </p>
                    <p>
                        Booking ID: <strong>${data.booking_id}</strong>
                    </p>
                    <p>
                        Status: <strong>Pending</strong>
                    </p>
                    <a href="user/my-bookings.html"
                       class="btn btn-primary"
                       style="margin-top:12px;">
                       View My Bookings
                    </a>
                </div>
            `;

            confirmBookingBtn.style.display = "none";

        } else {

            alert(data.message);
        }


    } catch (error) {

        console.log(error);

        alert("Cannot connect to server.");
    }

});

</script>

</body>
</html>
